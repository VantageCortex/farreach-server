name: FarReach Linux build

on:
  push:
    branches: [farreach-build]

permissions:
  contents: write

jobs:
  hbbs:
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: 318d629abc01c35effbba5dc422ee570b39c0eb9
      TAG: v1.1.17-farreach.2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev pkg-config
          rustc -V
          cargo build --release --locked --bin hbbs 2>&1 | tee build.log

      - name: Keep the build log
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -n 200 build.log > tail-build.log
          gh release create "build-log-$GITHUB_RUN_ID" tail-build.log --repo "$GITHUB_REPOSITORY" --draft --title "build log $GITHUB_RUN_ID" --notes "build failed"
          exit 1

      - name: Check
        run: |
          cp target/release/hbbs hbbs-linux-amd64
          file hbbs-linux-amd64
          ldd hbbs-linux-amd64
          ./hbbs-linux-amd64 --version
          sha256sum hbbs-linux-amd64 | tee hbbs-linux-amd64.sha256

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" hbbs-linux-amd64 hbbs-linux-amd64.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease \
            --title "hbbs 1.1.17-farreach.2" \
            --notes "hbbs for Ubuntu 24.04 x86_64 (glibc, OpenSSL 3), built from commit $SOURCE_SHA: upstream rustdesk-server 873230e plus the FarReach plan check (src/plan_check.rs). The check stays off unless FARREACH_PLAN_CHECK=on. License: AGPL-3.0."
